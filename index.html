<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos Climáticos</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      transition: background-color 0.5s ease;
      min-height: 100vh;
      background-color: #f0f0f0;
    }

    /* Botão de três pontos no canto superior direito */
    .menu-container {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }

    .dots-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .dots-btn:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    /* Menu dropdown */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background-color: #ffffff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      min-width: 160px;
    }

    .dropdown-menu.active {
      display: block;
    }

    .dropdown-menu button {
      width: 100%;
      padding: 10px 15px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .dropdown-menu button:hover {
      background-color: #f0f0f0;
    }

    /* Cores personalizadas para os temas climáticos */
    .theme-sol { background-color: #fff9c4; }      /* Amarelo claro */
    .theme-chuva { background-color: #b3e5fc; }    /* Azul claro */
    .theme-tempestade { background-color: #37474f; color: white; } /* Cinza escuro */
    .theme-neve { background-color: #e0f7fa; }     /* Ciano bem claro */
    .theme-seca { background-color: #d7ccc8; }     /* Marrom claro/seco */
  </style>
</head>
<body>

  <!-- Botão e Menu -->
  <div class="menu-container">
    <button class="dots-btn" id="menuBtn">&#8942;</button>
    <div class="dropdown-menu" id="dropdownMenu">
      <button onclick="mudarTema('theme-sol')">☀️ Ensolarado</button>
      <button onclick="mudarTema('theme-chuva')">🌧️ Chuvoso</button>
      <button onclick="mudarTema('theme-tempestade')">🌩️ Tempestade</button>
      <button onclick="mudarTema('theme-neve')">❄️ Neve</button>
      <button onclick="mudarTema('theme-seca')">🌵 Seca</button>
    </div>
  </div>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    // Alterna a exibição do menu ao clicar nos três pontos
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    // Fecha o menu se o usuário clicar fora dele
    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('active');
    });

    // Função para alterar a cor/tema da página
    function mudarTema(classeTema) {
      document.body.className = classeTema;
      dropdownMenu.classList.remove('active');
    }
  </script>

</body>
</html>
